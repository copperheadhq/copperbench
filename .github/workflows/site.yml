# Builds site/dist/ from the repository and publishes it to GitHub Pages.
#
# The page is generated from results/, tasks/, fixtures/ and the version
# constants in scripts/lib/record.ts, so a push that changes any of those
# republishes the numbers that depend on them. Nothing here needs a provider
# credential or the network beyond npm.
#
# One-time setup: Settings → Pages → Source → "GitHub Actions".

name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
